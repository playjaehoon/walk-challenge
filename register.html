<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>참가 신청 — Walk & Point 챌린지</title>
  <meta name="description" content="Walk & Point 챌린지 사전 등록">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="nav-logo">
    <img src="assets/logo.png" alt="Walk & Point" class="nav-logo-img">
    <span>Walk &amp; Point</span>
  </a>
  <ul class="nav-links" id="nav-links">
    <li><a href="index.html">홈</a></li>
    <li><a href="dashboard.html">내 기록</a></li>
    <li><a href="proof.html">걷기 인증</a></li>
    <li><a href="participants.html">달성 현황</a></li>
    <li><a href="about.html">학부 소개</a></li>
    <li><a href="health.html">신체건강 증진</a></li>
  </ul>
  <div class="nav-actions">
    <div id="nav-guest"><a href="register.html" class="btn btn-primary btn-sm active">참가 신청</a></div>
    <div id="nav-user" class="hidden" style="display:flex;align-items:center;gap:0.75rem">
      <span class="nav-score-badge" id="nav-score">0pt</span>
      <span style="font-size:0.875rem;color:var(--text-secondary)" id="nav-name"></span>
      <button onclick="logout()" class="btn btn-secondary btn-sm">로그아웃</button>
    </div>
  </div>
  <button class="nav-toggle" id="nav-toggle">☰</button>
</nav>

<div class="auth-page">
  <div class="auth-card" style="max-width:520px">
    <div class="auth-logo">
      <img src="assets/logo.png" alt="Walk & Point" class="auth-logo-img">
      <h1>Walk &amp; Point 참가 신청</h1>
      <p>글로벌스포츠산업학부 걷기 챌린지</p>
    </div>

    <div class="alert alert-info" style="margin-bottom:1.25rem">
      <span>📅</span>
      <span>챌린지 기간: <strong>2026년 5월 18일 ~ 31일</strong></span>
    </div>

    <form id="register-form" novalidate>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="name">이름 *</label>
          <input class="form-input" type="text" id="name" placeholder="홍길동" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="student-id">학번 *</label>
          <input class="form-input" type="text" id="student-id" placeholder="2024012345" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="department">학과 *</label>
        <input class="form-input" type="text" id="department" placeholder="글로벌스포츠산업학부" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="phone">연락처 *</label>
        <input class="form-input" type="tel" id="phone" placeholder="010-1234-5678" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">이메일 (로그인 ID) *</label>
        <input class="form-input" type="email" id="email" placeholder="example@hufs.ac.kr" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="password">비밀번호 *</label>
          <input class="form-input" type="password" id="password" placeholder="6자 이상" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="password2">비밀번호 확인 *</label>
          <input class="form-input" type="password" id="password2" placeholder="비밀번호 재입력" required>
        </div>
      </div>

      <div style="background:var(--bg-secondary);border-radius:var(--radius-md);padding:1rem;margin-bottom:1.25rem;font-size:0.8rem;color:var(--text-secondary)">
        <p style="margin:0">&#x2705; 등록 후 5월 18일 기준으로 QR 스캔 및 걷기 인증 기능이 활성화됩니다.</p>
      </div>

      <!-- 설문조사 동의 체크박스 -->
      <label id="survey-consent-label" for="survey-consent" style="
        display:flex;
        align-items:flex-start;
        gap:0.75rem;
        background:rgba(57,211,83,0.05);
        border:1px solid rgba(57,211,83,0.25);
        border-radius:var(--radius-md);
        padding:1rem;
        margin-bottom:1.25rem;
        cursor:pointer;
        transition:border-color 0.2s;
      ">
        <input type="checkbox" id="survey-consent" name="survey-consent" style="
          width:18px;
          height:18px;
          margin-top:2px;
          accent-color:var(--green);
          flex-shrink:0;
          cursor:pointer;
        ">
        <span style="font-size:0.875rem;line-height:1.5;color:var(--text-primary)">
          <strong>&#xC0AC;&#xC804;&#xB07C;&#xC0AC;&#xD6C4; &#xC124;&#xBB38;&#xC870;&#xC0AC; &#xCC38;&#xC5EC;&#xC5D0; &#xB3D9;&#xC758;&#xD569;&#xB2C8;&#xB2E4;. <span style="color:#ff6b6b">*</span></strong><br>
          <span style="color:var(--text-secondary);font-size:0.8rem">&#xCF54;&#xC2A4; &#xC6B4;&#xC601; &#xAC1C;&#xC120;&#xC744; &#xC704;&#xD55C; &#xC124;&#xBB38;&#xC5D0; &#xCC38;&#xC5EC;&#xD574; &#xC8FC;&#xC138;&#xC694;. (&#xD544;&#xC218;)</span>
        </span>
      </label>

      <button type="submit" id="register-btn" class="btn btn-primary w-full btn-lg">참가 신청하기</button>
    </form>

    <div class="auth-footer">
      이미 등록하셨나요? <a href="login.html">로그인하기</a>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-storage-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
