<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR 스캔 — Walk & Point 캠페인</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="nav-logo">
    <img src="assets/logo.png" alt="Walk & Point" class="nav-logo-img">
    <span>Walk &amp; Point</span>
  </a>
  <ul class="nav-links" id="nav-links">
    <li><a href="index.html">홈</a></li>
    <li><a href="dashboard.html">내 기록</a></li>
    <li><a href="proof.html">걷기 인증</a></li>
    <li><a href="participants.html">달성 현황</a></li>
    <li><a href="about.html">학부 소개</a></li>
    <li><a href="health.html">신체건강 증진</a></li>
  </ul>
  <div class="nav-actions">
    <div id="nav-guest"><a href="register.html" class="btn btn-primary btn-sm">참가 신청</a></div>
    <div id="nav-user" class="hidden" style="display:flex;align-items:center;gap:0.75rem">
      <span class="nav-score-badge" id="nav-score">0pt</span>
      <span style="font-size:0.875rem;color:var(--text-secondary)" id="nav-name"></span>
      <button onclick="logout()" class="btn btn-secondary btn-sm">로그아웃</button>
    </div>
  </div>
  <button class="nav-toggle" id="nav-toggle">☰</button>
</nav>

<div class="scan-container">

  <!-- 로딩 -->
  <div id="scan-loading">
    <div class="loading-spinner"></div>
    <p style="color:var(--text-secondary)">확인 중...</p>
  </div>

  <!-- 오류/상태 메시지 -->
  <div id="scan-message" class="hidden"></div>

  <!-- 카드 영역 -->
  <div id="scan-card-area" class="hidden" style="width:100%;max-width:440px">
    <div style="margin-bottom:0.5rem">
      <span class="rarity-badge rarity-rare" id="scan-count-display"></span>
    </div>
    <p style="font-size:0.9rem;margin-bottom:0.25rem;color:var(--text-secondary)">
      📍 <span id="scan-location-name"></span>
    </p>
    <h2 style="margin-bottom:2rem;font-size:1.5rem">카드를 클릭해서 등급을 확인하세요!</h2>

    <!-- Flip Card -->
    <div class="card-flip-wrapper">
      <div class="card-flip-inner" id="card-flip-inner">
        <!-- Back -->
        <div class="card-face card-back" id="card-back-area">
          <div class="card-back-pattern">🚶</div>
          <p style="font-size:1rem;font-weight:600;color:var(--text-primary)">두드려봐!</p>
          <p style="font-size:0.8rem;margin:0">클릭하여 등급 확인</p>
        </div>
        <!-- Front (dynamic) -->
        <div class="card-face card-front" id="card-front"></div>
      </div>
    </div>

    <p id="flip-hint" class="hidden" style="color:var(--text-secondary);font-size:0.85rem;margin-top:0.5rem;animation:pulse-dot 1.5s infinite">
      👆 카드를 클릭하세요
    </p>

    <!-- 결과 -->
    <style>
      @keyframes boo-pop {
        0% { transform: scale(0) rotate(-20deg) translateY(20px); opacity: 0; }
        60% { transform: scale(1.1) rotate(10deg) translateY(-5px); opacity: 1; }
        100% { transform: scale(1) rotate(0deg) translateY(0); opacity: 1; }
      }
      @keyframes boo-float {
        0% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(3deg); }
        100% { transform: translateY(0) rotate(0deg); }
      }
      .boo-animation {
        animation: boo-pop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, boo-float 3s ease-in-out 0.6s infinite;
      }
    </style>
    <div id="scan-result-info" class="hidden" style="margin-top:1.5rem;text-align:center; position:relative;">
      <!-- 랜덤 캐릭터 컨테이너 -->
      <div id="boo-character-container" class="hidden boo-animation" style="position:absolute; right: -10px; top: -60px; z-index:10; width:110px;">
        <img id="boo-character-img" src="" alt="캐릭터" style="width:100%; height:auto; filter:drop-shadow(0 6px 8px rgba(0,0,0,0.4));">
      </div>
      
      <p style="margin-bottom:0.5rem">획득 등급:</p>
      <span id="result-rarity-badge" class="rarity-badge"></span>
      <div style="font-family:'Outfit',sans-serif;font-size:2.5rem;font-weight:900;color:var(--green);margin:0.5rem 0" id="result-score"></div>
      <p style="font-size:0.85rem;margin-bottom:1.5rem">포인트가 적립되었습니다!</p>
      <div style="display:flex;gap:0.75rem;justify-content:center;flex-wrap:wrap">
        <a href="dashboard.html" class="btn btn-primary">내 기록 보기</a>
        <a href="participants.html" class="btn btn-secondary">달성 현황</a>
      </div>
    </div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-storage-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/app.js"></script>
<script src="js/scan.js"></script>
</body>
</html>
